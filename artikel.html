<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artikel · Platform Pendidikan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="hdr"></div>
<div class="pagehead"><div class="container"><h1>Artikel</h1><p>Tips belajar, literasi, dan panduan pendampingan untuk keluarga dan sekolah.</p></div></div>

<section class="s"><div class="container">
  <div class="chips" id="chips"></div>
  <div class="grid3" id="list"></div>
</div></section>

<div id="ftr"></div>
<script src="assets/site.js"></script>
<script>
let cur = 'Semua';
const cats = ['Semua', ...new Set(ARTICLES.map(a => a.cat))];
function render() {
  $('#chips').innerHTML = cats.map(c => `<button class="chip ${c === cur ? 'on' : ''}" onclick="cur='${c}';render()">${c}</button>`).join('');
  $('#list').innerHTML = ARTICLES.filter(a => cur === 'Semua' || a.cat === cur).map(a => articleCard(a, true)).join('');
}
render();
const h = location.hash.slice(1);
if (h && document.getElementById(h)) { toggleCard(h); document.getElementById(h).scrollIntoView({ block: 'center' }); }
</script>
</body>
</html>
